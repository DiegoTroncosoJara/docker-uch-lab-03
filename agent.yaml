apiVersion: v1
kind: Pod
spec:
  # ==============================================================================
  # Volumenes: credenciales de registro almacenadas en Secrets
  # ==============================================================================
  # Los volumenes pertenecen al Pod; volumeMounts decide que contenedor los recibe.
  volumes:
    - name: regcred-gh
      secret:
        secretName: regcred-gh
        items:
          - key: .dockerconfigjson
            path: config.json

    - name: regcred-dh
      secret:
        secretName: regcred-dh
        items:
          - key: .dockerconfigjson
            path: config.json
  containers:
    - name: node-tool
      # Misma version de Node 24 LTS y distribucion Debian usada en el Dockerfile.
      image: node:24.21.0-bookworm-slim
      # Evita ejecutar el comando Node por defecto al iniciar.
      command:
        # Mantiene disponible el contenedor mientras dura el pipeline.
        - cat
      # Terminal para el proceso cat.
      tty: true
      # Presupuesto de ejecucion de Node y sus procesos hijos.
      resources:
        # Recursos solicitados al scheduler.
        requests:
          # 0.1 CPU solicitado, no el maximo permitido.
          cpu: "100m"
          # 128Mi solicitados para ubicar el Pod.
          memory: "128Mi"
        # Topes durante instalacion, pruebas y compilacion.
        limits:
          # Maximo de 1 CPU.
          cpu: "1000m"
          # Maximo de 512Mi. --runInBand evita crear varios trabajadores Jest en paralelo.
          memory: "512Mi"
    # ==============================================================================
    # BuildKit: construccion y publicacion de imagenes
    # ==============================================================================
    - name: buildkit
      # BuildKit rootless no necesita el daemon Docker del host. La etiqueta rootless
      # no fija una version numerada de BuildKit.
      image: moby/buildkit:rootless
      # Deja la construccion a los pasos del pipeline, no al inicio del Pod.
      command:
        # Mantiene disponible el contenedor antes y entre las construcciones.
        - cat
      # Terminal para el proceso de espera.
      tty: true

      env:
        - name: BUILDKITD_FLAGS
          # evita crear un nuevo espacio de procesos y montar un /proc separado para cada RUN
          # Reduce el aislamiento entre los procesos de construcción dentro del contenedor BuildKit.
          value: --oci-worker-no-process-sandbox

      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: Unconfined
        appArmorProfile:
          type: Unconfined
      # Recursos para el constructor y los procesos que lanza durante el build.
      resources:
        # Requests de BuildKit; se suman a los de los otros contenedores del Pod.
        requests:
          # 1 CPU solicitado para construir imagenes.
          cpu: "1000m"
          # 256Mi de memoria solicitados, no el maximo permitido.
          memory: "256Mi"
        # Topes de ejecucion del constructor.
        limits:
          # Maximo de 1 CPU.
          cpu: "1000m"
          # Maximo de 2Gi. Un build que supera el limite puede terminar por OOMKilled.
          memory: "2Gi"
      volumeMounts:
        - name: regcred-gh
          mountPath: /docker-config/github
          readOnly: true

        - name: regcred-dh
          mountPath: /docker-config/dockerhub
          readOnly: true

    # Nombre usado por container("kubectl-tool") en los pipelines.
    - name: kubectl-tool
      # Imagen que proporciona herramientas de Kubernetes, incluido kubectl.
      image: alpine/k8s:1.36.1
      # Mantiene el contenedor preparado, sin lanzar un despliegue automaticamente.
      command:
        # Proceso de espera que Jenkins utilizara para ejecutar sus comandos.
        - cat
      # Terminal para mantener activo cat.
      tty: true

      # Recursos de las herramientas de Kubernetes.
      resources:
        # Requests del contenedor.
        requests:
          # 0.1 CPU solicitado.
          cpu: "100m"
          # 128Mi de memoria solicitados.
          memory: "128Mi"
        # Limits del contenedor.
        limits:
          # Como maximo 1 CPU.
          cpu: "1000m"
          # Como maximo 512Mi de memoria.
          memory: "512Mi"
